# 本插件的 bundle 层 patch：把 zcode-dispatch 插入 profile。
#
# ⚠️ 机器专有路径刻意**不写在这里**（runner / ledger / switch 都指向某个宿主项目，
#    属部署配置，不该进公开仓库）。请在 profile patch 里按 id 覆盖，例如
#    `~/.dsh/profiles/<profile>/cordis.patch.yml`：
#
#      - id: zcode-dispatch
#        name: 'dsh-zcode-dispatch'
#        config:
#          runnerPath: '<本仓库>/collab-kit/zcode-run.mjs'（通用工具仓库，非宿主项目）
#          ledgerPath: '<宿主仓库>\collab\logs\zcode-runs.jsonl'
#          workRoot:   '<本插件目录>\.data'
#          switchPath: '<宿主仓库>\collab\zcode-dispatch.switch.json'
#
#    三个路径都留空时的行为：不创建 dispatcher（面板走 demo 降级、agent 工具返回可读错误），
#    workRoot 缺省自动落到 <插件目录>/.data。详见 zcode-dispatch/README.md「配置」一节。
- insert:
    - id: zcode-dispatch
      name: 'dsh-zcode-dispatch'
      config:
        demo: false
        maxConcurrent: 3
